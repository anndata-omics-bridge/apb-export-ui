[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-export-ui"
version = "0.3.3"
description = "Locked web application for APB Export"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "anndata>=0.11",
    "apb-export>=0.2.3,<0.3",
    "apb2[duckdb,excel]>=0.1.4,<0.2",
    "apb-catalog>=0.1.6,<0.2",
    "apb-fasta>=0.1.2,<0.2",
    "protein-fasta>=0.3.2,<0.4",
    "prozor>=0.1.2,<0.2",
    "cyclopts>=4,<5",
    "fastapi>=0.142,<1",
    "loguru>=0.7,<1",
    "mudata>=0.4.1,<0.5",
    "numpy>=2,<3",
    "polars>=1.43,<2",
    "python-multipart>=0.0.32,<1",
    "uvicorn>=0.54,<1",
    "psutil>=7",
]

[project.scripts]
apb-export-web = "apb_export_ui.web.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<4",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.10",
    "twine>=6,<7",
    "types-psutil>=7.2.2.20260906",
]
docs = [
    "zensical==0.0.43",
]
# The QPX report application pins pMultiQC by Git commit, which PyPI refuses in a published
# wheel's metadata; development, tests, the smoke checks and the image install this group.
report = [
    "apb-pmultiqc @ git+https://github.com/anndata-omics-bridge/apb-pmultiqc.git@7340bdee164459b67ed34a66a5d6f761b029b045",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# SciPy, pandas and AnnData still propagate Unknown through supported public operations.
# Keep strict first-party checking while suppressing diagnostics with only that signal.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
patch = ["subprocess"]
branch = true
source = ["apb_export_ui"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_export_ui"]

[tool.deptry.per_rule_ignores]
# FastAPI parses multipart uploads through python-multipart without our importing it.
# The application sets floors for its APB graph; apb-fasta is invoked as a CLI.
DEP002 = ["python-multipart", "apb-fasta", "apb-catalog", "protein-fasta", "prozor"]

[tool.uv]
required-version = "==0.12.17"
no-sources = true
default-groups = ["dev", "report"]

[tool.uv.build-backend]
source-exclude = ["web/node_modules/**", "**/__pycache__/**", "**/*.pyc"]
source-include = ["web/**", "docs/**", "scripts/**", "Makefile", "Dockerfile", "uv.lock", ".python-version"]
