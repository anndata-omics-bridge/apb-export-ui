[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-export-ui"
version = "0.2.0"
description = "Locked web application for APB Export"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "anndata>=0.11",
    "apb-export @ git+https://github.com/anndata-omics-bridge/apb-export.git@33ae6a855df79197ed4efc0b6ba1d6ebbbc9bc33",
    "apb2 @ git+https://github.com/anndata-omics-bridge/apb2.git@9c6b088b45000407a2b4066cd8b90e3c1d686059",
    "apb-catalog @ git+https://github.com/anndata-omics-bridge/apb-catalog.git@abf7366780275ff953414b0841b9fa890cc62940",
    "apb-fasta @ git+https://github.com/anndata-omics-bridge/apb-fasta.git@5830b080542ed59ec4e40d7ca65e590c5beafe2e",
    "protein-fasta @ git+https://github.com/anndata-omics-bridge/protein-fasta.git@4048b16bcce895ca5d7a774d2ec0c11bb9bd34e2",
    "prozor @ git+https://github.com/anndata-omics-bridge/prozor.git@ab7c41bdfbbe877d66236c5c33549b7747426ace",
    "apb-pmultiqc @ git+https://github.com/anndata-omics-bridge/apb-pmultiqc.git@e415f7a3481891abe35a2670b086bc34609f5af9",
    "cyclopts>=4,<5",
    "fastapi>=0.142,<1",
    "loguru>=0.7,<1",
    "mudata>=0.4.1,<0.5",
    "numpy>=2,<3",
    "polars>=1.43,<2",
    "python-multipart>=0.0.32,<1",
    "uvicorn>=0.54,<1",
    "psutil>=7",
]

[project.scripts]
apb-export-web = "apb_export_ui.web.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<4",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.10",
    "twine>=6,<7",
    "types-psutil>=7.2.2.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# SciPy, pandas and AnnData still propagate Unknown through supported public operations.
# Keep strict first-party checking while suppressing diagnostics with only that signal.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
patch = ["subprocess"]
branch = true
source = ["apb_export_ui"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_export_ui"]

[tool.deptry.per_rule_ignores]
# FastAPI parses multipart uploads through python-multipart without our importing it.
# The application pins its APB graph; apb-fasta and apb-pmultiqc are invoked as CLIs.
DEP002 = ["python-multipart", "apb-fasta", "apb-catalog", "protein-fasta", "prozor", "apb-pmultiqc"]

[tool.uv]
required-version = "==0.12.17"
no-sources = true

[tool.uv.build-backend]
source-exclude = ["web/node_modules/**", "**/__pycache__/**", "**/*.pyc"]
source-include = ["web/**", "docs/**", "scripts/**", "Makefile", "Dockerfile", "uv.lock", ".python-version"]
