name: Publish UI image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read the locked exporter revision
        id: backend
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              dependencies = tomllib.load(handle)["project"]["dependencies"]
              print("revision=" + next(d for d in dependencies if d.startswith("apb-export @ ")).rsplit("@", 1)[1])
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/anndata-omics-bridge/apb-export-ui
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UI_REVISION=${{ github.sha }}
            EXPORTER_REVISION=${{ steps.backend.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
