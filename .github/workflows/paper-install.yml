name: Paper install
# Clean installs from PyPI alone, as the paper's readers make them: the launcher on each desktop
# system, converting through the app, then the SI walk-throughs (S10.1, S11.2) and the main
# text's apb-export command. Run by hand after a release.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  APP: http://127.0.0.1:8770
  SI_PACKAGES: apb2==0.1.3 apb-catalog==0.1.5 apb-fasta==0.1.2 protein-fasta==0.3.2 prozor==0.1.2
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Download the export example (S11.2)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir export && cd export
          H=0132a468ec6ae51a527d82560ff4a40f832f975c
          U=https://proteobench.cubimed.rub.de
          curl -O $U/datasets/$H/${H}_data.zip
          curl -O $U/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip
          unzip ${H}_data.zip
          unzip ProteoBenchFASTA_MixedSpecies_HYE.zip
          mv input_file.txt report.tsv
          mv param_0..txt report.log.txt
          R=https://raw.githubusercontent.com/anndata-omics-bridge/apb-proteobench/v0.2.0
          curl -O $R/src/apb_proteobench/data/modules/dia_aif.sdrf.tsv

      - name: The launcher installs from PyPI and the app converts the example
        working-directory: ${{ runner.temp }}/export
        run: |
          case "$RUNNER_OS" in
            Windows) cmd //c "$GITHUB_WORKSPACE\\launchers\\install.bat --no-browser" > launcher.log 2>&1 & ;;
            macOS) sh "$GITHUB_WORKSPACE/launchers/install.command" --no-browser > launcher.log 2>&1 & ;;
            *) sh "$GITHUB_WORKSPACE/launchers/install.sh" --no-browser > launcher.log 2>&1 & ;;
          esac
          for _ in $(seq 900); do
            curl -fsS "$APP/api/options.json" > options.json 2> /dev/null && break
            sleep 1
          done
          # A PyPI install has no apb-pmultiqc, so QPX is offered as tables only.
          grep -q '"title": "QPX"' options.json
          submit() {
            curl -fsS "$@" "$APP/api/jobs" | sed -n 's/.*"id": *"\([0-9a-f]*\)".*/\1/p'
          }
          finished() {
            for _ in $(seq 1200); do
              status=$(curl -fsS "$APP/api/jobs/$1/status.json")
              case "$status" in
                *'"state": "done"'*) return 0 ;;
                *'"state": "failed"'*) echo "$status"; curl -fsS "$APP/api/jobs/$1/job.log"; return 1 ;;
              esac
              sleep 1
            done
            return 1
          }
          prolfqua=$(submit -F output=apb-export:prolfqua -F data=@report.tsv \
            -F params=@report.log.txt -F annotation=@dia_aif.sdrf.tsv \
            -F fasta=@ProteoBenchFASTA_MixedSpecies_HYE.fasta)
          qpx=$(submit -F output=apb-export:qpx -F data=@report.tsv -F params=@report.log.txt)
          finished "$prolfqua"
          finished "$qpx"

      - name: Launcher log
        if: always()
        run: cat "$RUNNER_TEMP/export/launcher.log"

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Export example (S11.2) and the main text's apb-export command
        working-directory: ${{ runner.temp }}/export
        run: |
          uv venv --python 3.13 && source .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/activate
          uv pip install $SI_PACKAGES apb-export==0.2.2
          apb-export prolfqua report.tsv prolfqua.h5ad \
            --params report.log.txt \
            --annotation dia_aif.sdrf.tsv \
            --fasta ProteoBenchFASTA_MixedSpecies_HYE.fasta
          test -s prolfqua.h5ad

      - name: ProteoBench scoring example (S10.1)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir proteobench && cd proteobench
          H=269bb8310dc3f501834aaab5ca6fe72791c426e3
          U=https://proteobench.cubimed.rub.de
          curl -O $U/datasets/$H/${H}_data.zip
          curl -O $U/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip
          unzip ${H}_data.zip
          unzip ProteoBenchFASTA_MixedSpecies_HYE.zip
          mv input_file.parquet report.parquet
          mv param_0..txt report.log.txt
          uv venv --python 3.13 && source .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/activate
          uv pip install $SI_PACKAGES apb-proteobench==0.2.0
          apb2 convert report.parquet --params report.log.txt \
            --format hdf5 --output converted
          apb-fasta verify-peptides converted.h5mu \
            ProteoBenchFASTA_MixedSpecies_HYE.fasta \
            --output fasta-checked.h5mu
          apb-proteobench benchmark fasta-checked.h5mu \
            dia_astral scored.h5mu
          test -s scored.h5mu
